apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'

// Load signing configuration from key.properties if it exists
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def admobTestAppId = "ca-app-pub-3940256099942544~3347511713"
def admobProductionAppId = "ca-app-pub-4532705732070455~3296328938"
def admobTestPublisher = "3940256099942544"
def admobProductionPublisher = "4532705732070455"
def admobOldPublisher = "2971028314597685"
def bundledWebAssets = file("src/main/assets/public")
def crashlyticsMappingUploadEnabled = providers
    .gradleProperty("fluxgridCrashlyticsMappingUpload")
    .orElse("true")
    .get()
    .toBoolean()
def requiredSigningProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def hasKeyPropertiesSigning = keystorePropertiesFile.exists() &&
    requiredSigningProperties.every { key -> keystoreProperties[key]?.toString()?.trim() }
def hasInjectedSigning = providers
    .gradleProperty("android.injected.signing.store.file")
    .isPresent()

def bundledWebAssetsContain = { String value ->
    if (!bundledWebAssets.exists()) return false

    fileTree(bundledWebAssets) {
        include "**/*.js"
        include "**/*.html"
    }.files.any { file -> file.getText("UTF-8").contains(value) }
}

tasks.register("validateDebugAdAssets") {
    doLast {
        if (!bundledWebAssetsContain(admobTestPublisher) || bundledWebAssetsContain(admobProductionPublisher)) {
            throw new GradleException(
                "Debug web assets are not using Google test ads. Run: npm run build:android:debug && npm run cap:sync"
            )
        }
        if (bundledWebAssetsContain(admobOldPublisher)) {
            throw new GradleException("Debug web assets still contain the retired AdMob publisher ID.")
        }
    }
}

tasks.register("validateReleaseAdAssets") {
    doLast {
        if (!bundledWebAssetsContain(admobProductionPublisher)) {
            throw new GradleException(
                "Release web assets do not contain the production AdMob units. Run: npm run build:android:release && npm run cap:sync"
            )
        }
        if (bundledWebAssetsContain(admobOldPublisher)) {
            throw new GradleException("Release web assets still contain the retired AdMob publisher ID.")
        }
    }
}

tasks.register("validateReleaseSigning") {
    doLast {
        if (!hasKeyPropertiesSigning && !hasInjectedSigning) {
            throw new GradleException(
                "Release signing is not configured. Use Android Studio > Generate Signed App Bundle, " +
                "or configure android/key.properties for command-line release builds."
            )
        }

        if (hasKeyPropertiesSigning) {
            def configuredStoreFile = file(keystoreProperties["storeFile"])
            if (!configuredStoreFile.exists()) {
                throw new GradleException(
                    "Release keystore does not exist: ${configuredStoreFile.absolutePath}"
                )
            }
        }
    }
}

android {
    namespace = "com.fluxgrid.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fluxgrid.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10005
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            cruncherEnabled = true  // Task 16.5: Enable PNG optimization
        }
        
        // AdMob App ID
        manifestPlaceholders = [
            admobAppId: admobTestAppId
        ]
    }
    
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    
    buildTypes {
        debug {
            // Debug APKs must never request live ads.
            manifestPlaceholders = [admobAppId: admobTestAppId]
        }
        release {
            // Store builds use the FluxGrid production AdMob application.
            manifestPlaceholders = [admobAppId: admobProductionAppId]
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // Upload readable R8 mappings by default. For an emergency offline build:
            // -PfluxgridCrashlyticsMappingUpload=false
            firebaseCrashlytics {
                mappingFileUploadEnabled crashlyticsMappingUploadEnabled
            }
            minifyEnabled true
            shrinkResources true  // Task 16.5: Remove unused resources
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
}

afterEvaluate {
    tasks.named("preDebugBuild").configure {
        dependsOn tasks.named("validateDebugAdAssets")
    }
    tasks.named("preReleaseBuild").configure {
        dependsOn tasks.named("validateReleaseAdAssets")
        dependsOn tasks.named("validateReleaseSigning")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    
    // Firebase BoM (Bill of Materials)
    implementation platform('com.google.firebase:firebase-bom:34.11.0')
    
    // Firebase Analytics (optional, but recommended)
    implementation 'com.google.firebase:firebase-analytics'
    
    // Firebase Crashlytics
    implementation 'com.google.firebase:firebase-crashlytics'
    
    // Add other Firebase products as needed
    // implementation 'com.google.firebase:firebase-messaging'
    
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
