<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>FluxGrid - 2D Gravity Block Puzzle</title>
  <meta name="description"
    content="FluxGrid is a mobile 2D block puzzle where line clears trigger gravity, special blocks, combos, and fast timed runs." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FluxGrid" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <link rel="apple-touch-icon" href="icon-192.png" />

  <script>
    (function() {
      var path = window.location.pathname.replace(/\/+$/, '') || '/';
      var marketingRoutes = ['/', '/privacy', '/privacy-policy', '/support', '/contact'];
      var isNativeRuntime =
        !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
        /FluxGrid\/|Capacitor|; wv\)/i.test(window.navigator.userAgent);

      if (!isNativeRuntime && marketingRoutes.indexOf(path) >= 0) {
        document.documentElement.classList.add('marketing-entry');
      }
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400;500&family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Safe Area Support -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      background: #0f0e17;
    }

    #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0e17;
    }

    html.marketing-entry #splash {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="splash" style="position: fixed;inset: 0;background: #0f0e17;display: flex;flex-direction: column;align-items: center;justify-content: center;z-index: 9999;visibility:visible;opacity:1;transition:opacity 0.18s ease;">
    <div style="text-align:center; margin-bottom: 42px;">
      <div style="font-family: 'Inter', system-ui, sans-serif;font-size: 50px;font-weight: 900;color: #e0f2fe;letter-spacing: -0.04em;line-height: 1;text-shadow: 0 10px 32px rgba(59,130,246,0.20);">
        Flux<span style="color:#3b82f6">Grid</span>
      </div>
      <div style="font-size: 10px;color: rgba(224,242,254,0.35);letter-spacing: 0.18em;margin-top: 10px;font-family: 'Inter', system-ui, sans-serif;font-weight:700;">
        2D GRAVITY PUZZLE
      </div>
    </div>

    <div id="splash-text" style="text-align:center;font-size:10px;color:rgba(255,255,255,0.28);font-family:'Inter',system-ui,sans-serif;letter-spacing:0.08em;">
      HAZIRLANIYOR
    </div>

    <div style="position: absolute;bottom: 60px;display: flex;gap: 6px;opacity: 0.22;">
      <div style="width:6px;height:6px;border-radius:2px;background:#3b82f6"></div>
      <div style="width:6px;height:6px;border-radius:2px;background:#a78bfa"></div>
      <div style="width:6px;height:6px;border-radius:2px;background:#06b6d4"></div>
      <div style="width:6px;height:6px;border-radius:2px;background:#10b981"></div>
      <div style="width:6px;height:6px;border-radius:2px;background:#f59e0b"></div>
    </div>
  </div>

  <script>
    (function() {
      var splash = document.getElementById('splash');
      var completed = false;

      function releaseNativeLaunchSplash() {
        var nativeSplash = window.FluxGridSplash;
        if (nativeSplash && typeof nativeSplash.hide === 'function') {
          nativeSplash.hide();
          return true;
        }
        return false;
      }

      requestAnimationFrame(function() {
        var releaseAttempts = 0;
        setTimeout(function retryNativeSplashRelease() {
          if (releaseNativeLaunchSplash()) return;
          releaseAttempts += 1;
          if (releaseAttempts >= 20) return;
          setTimeout(retryNativeSplashRelease, 50);
        }, 120);
      });

      window.splashComplete = function() {
        if (completed) return;
        completed = true;
        if (!splash) return;

        splash.style.opacity = '0';
        setTimeout(function() {
          splash.style.display = 'none';
        }, 180);
      };
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/app/index.tsx"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swPath = new URL('sw.js', document.baseURI).href;

        navigator.serviceWorker.register(swPath)
          .then((registration) => {
            console.log('SW registered:', registration.scope);
          })
          .catch((error) => {
            console.error('SW registration failed:', error);
          });
      });
    }
  </script>
</body>

</html>
